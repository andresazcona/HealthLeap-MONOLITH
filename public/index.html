<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthLeap Demo</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --brand:#0f766e; --brand-ink:#fff; --bad:#b42318; --ok:#067647; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --ink:#e6e8ec; --muted:#98a2b3; --line:#2a303b; --brand:#2dd4bf; --brand-ink:#04211e; --bad:#f97066; --ok:#47cd89; } }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:20px 16px; border-bottom:1px solid var(--line); background:var(--card); }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; color:var(--muted); }
    main { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
    .card h2 { margin:0 0 12px; font-size:16px; }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button, select, input { font:inherit; padding:7px 12px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
    button { cursor:pointer; }
    button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
    button.slot { padding:5px 10px; }
    button:disabled { opacity:.5; cursor:default; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
    th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { color:var(--muted); font-weight:600; }
    .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
    .muted { color:var(--muted); }
    #toast { position:fixed; left:16px; right:16px; bottom:16px; max-width:520px; margin:0 auto; padding:10px 14px; border-radius:8px; background:var(--ink); color:var(--bg); display:none; }
    #toast.bad { background:var(--bad); color:#fff; }
    .hidden { display:none; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-top:10px; }
    .stat { border:1px solid var(--line); border-radius:8px; padding:10px; }
    .stat b { display:block; font-size:22px; }
    .scroll { overflow-x:auto; }
  </style>
</head>
<body>
  <header>
    <h1>HealthLeap · consola de demo</h1>
    <p>Entra con una cuenta de prueba y usa la API como lo haría cada rol. Horas en hora de Colombia.</p>
  </header>
  <main>
    <section class="card">
      <h2>Sesión</h2>
      <div class="row">
        <select id="cuenta">
          <option value="paciente@example.com">Paciente · Pedro Gómez</option>
          <option value="maria.lopez@example.com">Paciente · María López</option>
          <option value="ana.ruiz@example.com">Médica · Dra. Ana Ruiz (Cardiología)</option>
          <option value="carlos.mendez@example.com">Médico · Dr. Carlos Méndez (Pediatría)</option>
          <option value="sofia.torres@example.com">Médica · Dra. Sofía Torres (Dermatología)</option>
          <option value="admision@example.com">Admisión · Laura Recepción</option>
          <option value="admin@example.com">Admin</option>
        </select>
        <button class="primary" id="entrar">Entrar</button>
        <span id="quien" class="muted">Sin sesión. Contraseña de todas: Demo1234!</span>
      </div>
    </section>

    <section class="card hidden" data-rol="paciente">
      <h2>Agendar cita</h2>
      <div class="row">
        <select id="especialidad"></select>
        <select id="medico"></select>
        <input type="date" id="fecha">
        <button id="verHorarios">Ver horarios</button>
      </div>
      <div id="horarios" class="row" style="margin-top:12px"></div>
    </section>

    <section class="card hidden" data-rol="paciente medico">
      <h2 id="tituloCitas">Mis citas</h2>
      <button id="recargarCitas">Actualizar</button>
      <div class="scroll"><table id="tablaCitas"></table></div>
    </section>

    <section class="card hidden" data-rol="medico">
      <h2>Bloquear horario</h2>
      <div class="row">
        <input type="date" id="bFecha">
        <input type="time" id="bInicio" value="12:00" step="1800">
        <span class="muted">a</span>
        <input type="time" id="bFin" value="13:00" step="1800">
        <button id="bloquear">Bloquear</button>
      </div>
    </section>

    <section class="card hidden" data-rol="admisión admin">
      <h2>Agenda del día</h2>
      <div class="row">
        <input type="date" id="aFecha">
        <button id="verAgenda">Ver</button>
      </div>
      <div class="scroll"><table id="tablaAgenda"></table></div>
    </section>

    <section class="card hidden" data-rol="admin">
      <h2>Reportes</h2>
      <div class="row">
        <button id="verResumen">Resumen</button>
        <button id="descargarCsv">Descargar CSV</button>
      </div>
      <div id="resumen" class="stats"></div>
    </section>
  </main>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
