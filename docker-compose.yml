# Levanta todo con: docker compose up -d --build
# Abre http://localhost:3000 (cuentas demo en el README, contraseña Demo1234!)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthleap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthleap}
      POSTGRES_DB: healthleap
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthleap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://healthleap:${DB_PASSWORD:-healthleap}@db:5432/healthleap
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en .env}
      EMAIL_USER: ${EMAIL_USER:-no-reply@example.com}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-disabled}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Primer administrador (se crea solo si no existe)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # true carga cuentas de demo con contraseña pública Demo1234!: solo para probar, nunca en producción
      SEED_DEMO: ${SEED_DEMO:-false}
    # El esquema es idempotente: se aplica en cada arranque
    command: sh -c "node db/setup.js && node dist/server.js"

volumes:
  db-data:
