name: HealthLeap CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write    # publicar cobertura en gh-pages

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: healthleap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Unit tests (API)
      run: npm run test:unit -w @healthleap/api

    - name: Integration tests (API)
      run: npm run test:integration -w @healthleap/api

    - name: Build API + web
      run: npm run build

    - name: E2E against real Postgres
      working-directory: apps/api
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthleap_test
        JWT_SECRET: ci_secret
        JWT_REFRESH_SECRET: ci_refresh_secret
        EMAIL_USER: ci@example.com
        EMAIL_APP_PASSWORD: disabled
        PORT: 3000
      run: |
        npm run db:setup
        node dist/server.js &
        npx --yes wait-on -t 30000 http://localhost:3000/health
        npm run test:e2e:api

    - name: Coverage report
      working-directory: apps/api
      run: npm run test:coverage -- --coverageReporters=html-spa --coverageReporters=text-summary

    - name: Publish coverage to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./apps/api/coverage
        publish_branch: gh-pages
