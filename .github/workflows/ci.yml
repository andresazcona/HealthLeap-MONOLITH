name: HealthLeap CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Agregar permisos explícitos para solucionar el error 403
permissions:
  contents: write    # Necesario para publicar en gh-pages
  pages: write       # Necesario para GitHub Pages
  id-token: write    # Necesario para verificación de token

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: healthleap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run lint
      run: npm run lint || echo "Linting skipped"
      
    - name: Run unit tests
      run: npm run test:unit
    
    - name: Run integration tests
      run: npm run test:integration
      
    - name: Build
      run: npm run build

    - name: E2E against real Postgres
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthleap_test
        JWT_SECRET: ci_secret
        JWT_REFRESH_SECRET: ci_refresh_secret
        EMAIL_USER: ci@example.com
        EMAIL_APP_PASSWORD: disabled
        PORT: 3000
      run: |
        npm run db:setup
        node dist/server.js &
        npx --yes wait-on -t 30000 http://localhost:3000/health
        npm run test:e2e:api
    
    - name: Generate test reports
      run: npm run test:report || echo "Report generation skipped"
      if: always()
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: reports/
        if-no-files-found: ignore

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: always()
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/lcov.info
          
  generate-report:
    needs: test
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    steps:
    - uses: actions/checkout@v4
    
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        name: test-results
        path: allure-results
    
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: hashFiles('allure-results/*') != ''
      with:
        allure_results: allure-results
        allure_report: allure-report
        allure_history: allure-history
        keep_reports: 20
    
    - name: Publish Allure Report
      uses: peaceiris/actions-gh-pages@v3
      if: hashFiles('allure-report/*') != ''
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages
        keep_files: true
